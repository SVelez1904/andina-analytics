# Pruebas automáticas: corren en cada pull request y antes de cada despliegue.
# Todo usa herramientas gratuitas. Si una prueba falla, el despliegue NO ocurre.
name: CI

on:
  pull_request:
    paths: ["finanzas/**", ".github/workflows/**", ".gitleaksignore"]
  push:
    branches-ignore: [master]   # main se prueba dentro de deploy.yml
    paths: ["finanzas/**", ".github/workflows/**", ".gitleaksignore"]
  workflow_call:               # deploy.yml y preview.yml reutilizan este workflow
  workflow_dispatch:           # botón "Run workflow" para correr las pruebas a mano

permissions:
  contents: read

# El proyecto vive en la subcarpeta finanzas/ del repo andina_analytics
defaults:
  run:
    working-directory: finanzas

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Estilo y errores (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: finanzas
      - name: Revisar los workflows de GitHub (actionlint)
        working-directory: .
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.4
          ./actionlint -color

  tests:
    name: Pruebas (pytest + cobertura)
    runs-on: ubuntu-latest
    env:
      GCP_PROYECTO: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finanzas/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=55
      - name: Resumen de cobertura
        if: always()
        run: |
          echo '### Cobertura de pruebas' >> "$GITHUB_STEP_SUMMARY"
          python -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot(); print(f\"**{float(r.get('line-rate'))*100:.0f}%** de las líneas probadas\")" >> "$GITHUB_STEP_SUMMARY" || true

  seguridad:
    name: Seguridad (dependencias y secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnerabilidades conocidas en dependencias (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Claves o contraseñas subidas por error (gitleaks)
        working-directory: .
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -v .

  sql-dry-run:
    name: SQL contra BigQuery (dry-run, gratis)
    runs-on: ubuntu-latest
    # Solo si GCP ya está conectado (variables del repo) y el PR no viene de un fork
    if: vars.GCP_WIF_PROVIDER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_DEPLOY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-cloud-bigquery
      - run: python scripts/validar_sql_bigquery.py --proyecto "${{ vars.GCP_PROYECTO }}" sql/03_vistas.sql
