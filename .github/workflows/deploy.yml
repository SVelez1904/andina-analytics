# Despliegue a producción: cada push (o merge de un PR) a main.
# 1) corre todas las pruebas de ci.yml  2) si pasan, publica la app y actualiza el informe mensual.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["finanzas/**", ".github/workflows/**", ".gitleaksignore"]
  workflow_dispatch:   # botón "Run workflow" para desplegar a mano

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

defaults:
  run:
    working-directory: finanzas   # el Dockerfile y el código están en finanzas/

env:
  REGION: us-central1
  SERVICIO: finanzas-str
  JOB: informe-mensual

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicar en Cloud Run
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # para autenticarse en GCP sin llaves (Workload Identity Federation)
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_DEPLOY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar la app
        run: |
          gcloud run deploy "$SERVICIO" \
            --source . \
            --region "$REGION" \
            --service-account "finanzas-app@${{ vars.GCP_PROYECTO }}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated --iap \
            --min-instances 0 --max-instances 1 --cpu 1 --memory 1Gi \
            --timeout 3600 --session-affinity \
            --set-env-vars "GCP_PROYECTO=${{ vars.GCP_PROYECTO }},BQ_DATASET=finanzas,BUCKET_BOLETAS=${{ vars.GCP_PROYECTO }}-boletas,CLAUDE_MODEL=claude-haiku-5-5" \
            ${{ vars.USA_API_CLAUDE == 'true' && '--set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest' || '' }} \
            --labels "commit=${GITHUB_SHA::7}" \
            --quiet

      - name: Actualizar el informe mensual con la misma imagen
        run: |
          IMAGEN=$(gcloud run services describe "$SERVICIO" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          if gcloud run jobs describe "$JOB" --region "$REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$JOB" --region "$REGION" --image "$IMAGEN" --quiet
          else
            echo "El job $JOB aún no existe: créalo una vez con deploy/03_informe_mensual.sh"
          fi

      - name: Verificar que la nueva versión quedó sirviendo
        run: |
          gcloud run services describe "$SERVICIO" --region "$REGION" \
            --format='value(status.conditions[0].type,status.conditions[0].status,status.latestReadyRevisionName)'
          URL=$(gcloud run services describe "$SERVICIO" --region "$REGION" --format='value(status.url)')
          echo "### Desplegado ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA::7}\` → $URL" >> "$GITHUB_STEP_SUMMARY"
